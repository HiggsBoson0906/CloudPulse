services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cloudpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudpulse-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: cloudpulse-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      SERVICE_NAME: "cloudpulse"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloudpulse}"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      ALLOW_PRIVATE_TARGETS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  monitoring-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-monitoring-worker
    command: ["node", "dist/workers/monitoring.worker.js"]
    environment:
      NODE_ENV: "production"
      SERVICE_NAME: "cloudpulse-monitoring-worker"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloudpulse}"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      WORKER_CHECK_INTERVAL_MS: "5000"
      WORKER_CONCURRENCY: "10"
      ALLOW_PRIVATE_TARGETS: "false"
      ALLOWED_PRIVATE_HOSTS: "mock-service"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  event-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-event-worker
    command: ["node", "dist/workers/event-processor.worker.js"]
    environment:
      NODE_ENV: "production"
      SERVICE_NAME: "cloudpulse-event-worker"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloudpulse}"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      ALLOW_PRIVATE_TARGETS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  mock-service:
    image: node:22-alpine
    container_name: cloudpulse-mock-service
    command: >
      node -e "
      const http = require('http');
      let failing = false;
      const server = http.createServer((req, res) => {
        if (req.url === '/health') {
          if (failing) {
            res.writeHead(503, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ status: 'DOWN', error: 'Service Unavailable' }));
          } else {
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ status: 'UP', service: 'mock-auth-service' }));
          }
        } else if (req.url === '/gateway/health') {
          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ status: 'UP', service: 'mock-gateway' }));
        } else if (req.url === '/fail') {
          failing = true;
          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ failing: true }));
        } else if (req.url === '/recover') {
          failing = false;
          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ failing: false }));
        } else {
          res.writeHead(404);
          res.end();
        }
      });
      server.listen(8080, () => console.log('Mock health service listening on 8080'));
      "
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  postgres_data:
